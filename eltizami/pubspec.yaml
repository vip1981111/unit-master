name: eltizami
description: Eltizami - التزامي - Professional Habit Tracker App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.4.1
  path: ^1.9.0

  # Calendar
  table_calendar: ^3.1.3

  # Charts
  fl_chart: ^0.70.2

  # UI Components
  flutter_slidable: ^3.1.1
  cupertino_icons: ^1.0.8

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Localization
  intl: any

  # Icons
  font_awesome_flutter: ^10.7.0

  # UUID for unique IDs
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
